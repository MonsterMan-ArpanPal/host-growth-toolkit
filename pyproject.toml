[project]
name = "wayzyy"
version = "0.1.0"
description = "Wayzyy — AI-powered short-term rental host platform backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "requests>=2.32",
  "numpy>=1.26",
  "pandas>=2.2",
  "joblib>=1.4",
  # Pinned <1.8: models/best_pricing_model_v1_2.pkl was fitted by sklearn
  # <1.8. sklearn 1.9 renamed SimpleImputer._fit_dtype -> _fill_dtype, which
  # breaks unpickling/transform of the existing model artifact.
  "scikit-learn>=1.4,<1.8",
  "twilio>=9.0",
  "groq>=0.9",
  "python-dotenv>=1.0",
  "tinydb>=4.8",
]

# Local photo quality-checking (PyIQA + OpenCV + Pillow).
# These are HEAVY (PyIQA pulls in PyTorch) and entirely optional —
# without them the pipeline skips blur/quality flagging but still
# runs the vision + writer LLM steps. Install with:
#   uv sync --extra image-qc
[project.optional-dependencies]
image-qc = [
  "pyiqa>=0.1.3",
  "opencv-python-headless>=4.9",
  "pillow>=10.3",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27", # FastAPI TestClient
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "api",
]
